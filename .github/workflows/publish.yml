name: Publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: github.repository == 'DelSkayn/rquickjs' || github.repository == 'katyo/rquickjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          # v2's new build-warnings=deny default also denies things the old
          # "-D warnings" RUSTFLAGS default never did (build-script
          # `cargo:warning=` output, unused-workspace-dependency manifest
          # warnings); restore the old, narrower behavior explicitly.
          build-warnings: ""
          rustflags: "-D warnings"
      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CRATES_TOKEN }}
          no-verify: false # otherwise the dependencies are not sorted
